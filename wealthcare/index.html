function hero(){return `<section class="hero"><div class="heroMedia">${photos.hero.map((p,i)=>`<div class="heroSlide${i===0?' active':''}" style="background-image:url('${p}')"></div>`).join('')}</div><div class="heroCopy"><div class="eyebrow">WEALTHCARE • I LOVE WEALTH</div><h1>ONE BRAND.<br><span class="stroke">A WHOLE</span> <span class="brush">WORLD.</span></h1><p>We create opportunities, build skills, give back, and help young people experience more. Explore what WealthCare can become with you.</p><div class="actions"><a class="pill green" href="#/world">ENTER THE WORLD →</a><a class="pill" href="#/be-part-of-it">BE PART OF IT</a></div><div class="heroWorlds"><a class="worldMini" style="background-image:url('${photos.wear}')" href="#/wear-it"><div><strong>WEAR IT.</strong><small>Clothing • Identity • Style</small></div></a><a class="worldMini" style="background-image:url('${photos.build}')" href="#/build-it"><div><strong>BUILD IT.</strong><small>Work • Landscaping • Opportunity</small></div></a><a class="worldMini" style="background-image:url('${photos.give}')" href="#/give-it"><div><strong>GIVE IT.</strong><small>Community • Giving • Impact</small></div></a><a class="worldMini" style="background-image:url('${photos.hero[4]}')" href="#/live-it"><div><strong>LIVE IT.</strong><small>Youth • Activities • Experience</small></div></a></div></div></section>`}
function home(){return `<section class="homeHero" aria-label="I Love Wealth"><div class="homeHeroMedia" aria-hidden="true">${photos.hero.map((p,i)=>`<div class="homeHeroSlide${i===0?' active':''}" style="background-image:url('${p}')"></div>`).join('')}</div><div class="homeHeroContent"><div class="sideNote"><span>MORE THAN A PROGRAM</span>IT'S A MOVEMENT.<br><br>Young people should have places to learn, create, work, play and grow.</div><div class="heroCenter"><h1><span class="love">I LOVE</span><br><span class="wealth">WEALTH</span></h1><div class="tagline">YOUTH • OPPORTUNITY • COMMUNITY • A BRIGHTER TOMORROW</div><div class="referenceBar"><a class="pill green" href="#/world">ENTER THE WORLD →</a><a class="pill" href="#/be-part-of-it">BE PART OF IT</a></div></div><div class="sideNote" style="text-align:right"><span>WE LEAD</span>WE BUILD<br>WE CARE.<br><br>One world. Different ways to belong.</div><div class="worldDock"><a class="worldTile" style="background-image:url('${photos.wear}')" href="#/wear-it"><div class="tileText"><b>WEAR IT.</b><small>Style • Culture • I Love Wealth</small></div></a><a class="worldTile" style="background-image:url('${photos.build}')" href="#/build-it"><div class="tileText"><b>BUILD IT.</b><small>Landscaping • Work • Opportunity</small></div></a><a class="worldTile" style="background-image:url('${photos.give}')" href="#/give-it"><div class="tileText"><b>GIVE IT.</b><small>Community • Giving • Impact</small></div></a><a class="worldTile" style="background-image:url('${photos.hero[4]}')" href="#/live-it"><div class="tileText"><b>LIVE IT.</b><small>Sports • Trips • Skills • Fun</small></div></a></div></div></section><section class="wcShowcase" id="experiences"><div class="eyebrow">THE WEALTHCARE EXPERIENCE</div><h2>MORE THAN ONE WAY<br>TO LIVE WEALTH.</h2><p>From the barbershop to the studio, from bike rides to building projects: discover the skills, friendships and experiences we're working to bring together.</p><div class="wcShowGrid"><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.swim}')"></div><span class="wcTag">LIVE IT</span><h3>Parties &amp; social events</h3><p>Music, teen events, good energy and memories with friends.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.wear}')"></div><span class="wcTag">LEARN IT</span><h3>Barber &amp; beauty skills</h3><p>Haircuts, braiding, styling and learning from local professionals.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.robotics}')"></div><span class="wcTag">CREATE IT</span><h3>Music &amp; studios</h3><p>Recording, producing, making art and learning creative skills.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.backpack}')"></div><span class="wcTag">EXPLORE IT</span><h3>Bike rides &amp; field trips</h3><p>Get outside, see new places and try new adventures.</p></a><a class="wcShowCard" href="#/build-it"><div class="wcShowPic" style="background-image:url('${photos.build}')"></div><span class="wcTag">BUILD IT</span><h3>Work &amp; hands-on projects</h3><p>Landscaping, practical skills, construction learning and teamwork.</p></a><a class="wcShowCard" href="#/give-it"><div class="wcShowPic" style="background-image:url('${photos.give}')"></div><span class="wcTag">GIVE IT</span><h3>Helping the community</h3><p>Food, clothing, volunteering and making a difference.</p></a></div><p class="wcNote">Photography is illustrative and does not claim to depict past WealthCare events. Dedicated barber, studio, bike and teen-party photos can be swapped in once approved.</p></section><section class="section dark"><div class="sectionTitle"><div><div class="eyebrow">THE WORLD BEHIND THE NAME</div><h2>More than<br>one lane.</h2></div><p>WealthCare connects clothing, work, youth development, community impact and experiences in one place. Choose a world and keep exploring.</p></div><div class="featureBand" style="border-radius:30px;overflow:hidden"><div class="featurePhoto" style="background-image:url('${photos.hero[4]}')"></div><div class="featureText"><div class="eyebrow">LIVE IT</div><h3>Go have<br>a life.</h3><p>Sports. Cooking. Music. Art. STEM. Gaming. Field trips. Leadership. Mentorship. There is always something to learn, make, try or experience.</p><div class="actions"><a class="pill green" href="#/live-it">EXPLORE LIVE IT →</a><a class="pill" href="#/join-youth">JOIN THE YOUTH PROGRAM</a></div></div></div></section>`}

uild. We can collect the details needed for the next step.</p></div><div class="actions"><a class="pill green" href="#/quote">START A PROJECT</a><a class="pill" href="#/book">BOOK SERVICE</a><a class="pill" href="#/services">EXPLORE SERVICES</a></div></section>`}
function live(){return `<section class="pageHead"><div class="eyebrow">LIVE IT</div><h1>FIND<br><span class="brush">SOMETHING</span><br>TO DO.</h1><p>A compact digital clubhouse for learning, creating, playing, building, helping, earning and exploring.</p></section><section class="wcShowcase" id="live-experiences"><div class="eyebrow">THE WEALTHCARE EXPERIENCE</div><h2>MORE THAN ONE WAY<br>TO LIVE WEALTH.</h2><p>From the barbershop to the studio, from bike rides to building projects: discover the skills, friendships and experiences we're working to bring together.</p><div class="wcShowGrid"><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.swim}')"></div><span class="wcTag">LIVE IT</span><h3>Parties &amp; social events</h3><p>Music, teen events, good energy and memories with friends.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.wear}')"></div><span class="wcTag">LEARN IT</span><h3>Barber &amp; beauty skills</h3><p>Haircuts, braiding, styling and learning from local professionals.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.robotics}')"></div><span class="wcTag">CREATE IT</span><h3>Music &amp; studios</h3><p>Recording, producing, making art and learning creative skills.</p></a><a class="wcShowCard" href="#/live-it"><div class="wcShowPic" style="background-image:url('${photos.backpack}')"></div><span class="wcTag">EXPLORE IT</span><h3>Bike rides &amp; field trips</h3><p>Get outside, see new places and try new adventures.</p></a><a class="wcShowCard" href="#/build-it"><div class="wcShowPic" style="background-image:url('${photos.build}')"></div><span class="wcTag">BUILD IT</span><h3>Work &amp; hands-on projects</h3><p>Landscaping, practical skills, construction learning and teamwork.</p></a><a class="wcShowCard" href="#/give-it"><div class="wcShowPic" style="background-image:url('${photos.give}')"></div><span class="wcTag">GIVE IT</span><h3>Helping the community</h3><p>Food, clothing, volunteering and making a difference.</p></a></div><p class="wcNote">Photography is illustrative and does not claim to depict past WealthCare events. Dedicated barber, studio, bike and teen-party photos can be swapped in once approved.</p></section><section class="section youthTop"><div class="sectionTitle"><div><div class="eyebrow">QUICK PICKS</div><h2>What can I do<br>today?</h2></div><p>Pick a lane. You don't need to know exactly what you want yet.</p></div><div class="quickGrid"><a class="quick" style="background-image:url('${photos.cooking}')" href="#/activity/cooking"><strong>Cook</strong><small>Make something from scratch.</small></a><a class="quick" style="background-image:url('${photos.build}')" href="#/activity/build"><strong>Build</strong><small>Use your hands and learn.</small></a><a class="quick" style="background-image:url('${photos.basketball}')" href="#/activity/sports"><strong>Play</strong><small>Sports, movement and teams.</small></a><a class="quick" style="background-image:url('${photos.robotics}')" href="#/activity/stem"><strong>Create</strong><small>Art, media, music and STEM.</small></a><a class="quick" style="background-image:url('${photos.give}')" href="#/activity/help"><strong>Help</strong><small>Community service and giving.</small></a><a class="quick" style="background-image:url('${photos.wear}')" href="#/activity/earn"><strong>Earn</strong><small>Money, business and opportunity.</small></a><a class="quick" style="background-image:url('${photos.backpack}')" href="#/trips"><strong>Explore</strong><small>Trips and new experiences.</small></a><a class="quick" style="background-image:url('${photos.swim}')" href="#/activity/adventure"><strong>Adventure</strong><small>Water and outdoor experiences.</small></a></div></section><section class="section"><div class="sectionTitle"><div><div class="eyebrow">FIND YOUR THING</div><h2>Learn + Do.</h2></div><p>Small visual paths instead of giant walls of text. Open one to learn, make, practice or join.</p></div><div class="pathGrid">${['Cooking','Money','Business','Life Skills','Building','Landscaping','Hair & Beauty','Music','Art & Design','STEM & Robotics','Media','Gaming','Sports','Travel','Leadership'].map((x,i)=>`<a class="path" href="#/skill/${x.toLowerCase().replaceAll(' ','-').replaceAll('&','and')}"><b>${x}</b><span>Learn • Make • Level Up →</span></a>`).join('')}</div></section><section class="section dark"><div class="sectionTitle"><div><div class="eyebrow">SKILL PATHS</div><h2>From youth<br>to opportunity.</h2></div><p>Discover → Learn → Practice → Build → Earn → Lead.</p></div><div class="pathGrid">${['Creator','Entrepreneur','Athlete','Chef','Artist','Engineer','Leader','Stylist','Landscaper','Musician'].map(x=>`<a class="path" href="#/path/${x.toLowerCase()}"><b>${x}</b><span>Explore this path →</span></a>`).join('')}</div></section><section class="section"><div class="sectionTitle"><div><div class="eyebrow">CHALLENGES</div><h2>Try something.</h2></div><p>Real actions that can become habits, skills and stories.</p></div><div class="challenge">${['Cook Something','Create Something','Help Somebody','Save $10','Learn a Skill','Plant Something','Make a Video','Read Something','Build Something'].map(x=>`<a href="#/challenge/${x.toLowerCase().replaceAll(' ','-').replace('$','')}" ><div><b>${x}</b><p style="color:#8fa5b0">Open challenge →</p></div></a>`).join('')}</div></section>`}

function unusedHomeSlides(){const slides=[...document.querySelectorAll('.homeHeroSlide')];if(slides.length<2)return;slides.forEach(s=>{const m=s.style.backgroundImage.match(/url\(['\"]?(.*?)['\"]?\)/);if(m){const img=new Image();img.src=m[1]}});let i=0;const advance=()=>{const next=(i+1)%slides.length;slides[next].classList.add('active');window.setTimeout(()=>{slides[i].classList.remove('active');i=next},900);};window.setInterval(advance,5200)}

function heading(title,text){return `<section class="pageHead"><div class="eyebrow">WEALTHCARE • CHATTANOOGA</div><h1>${esc(title)}</h1><p>${esc(text)}</p></section>`}
function requestForm(kind){return `<form class="form" onsubmit="saveRequest(event,'${kind}')"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label><label>Interest<input name="interest" value="${esc(kind)}" required></label><label class="full">Details<textarea name="details" required placeholder="What would you like to arrange?"></textarea></label><p class="full">Download your request and send it to WealthCare. This website has no connected delivery service yet.</p><button class="pill green full">DOWNLOAD REQUEST</button><div class="full" role="status" id="requestStatus"></div></form>`}
function saveRequest(e,kind){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));downloadText('WealthCare_Request.txt',kind+'\n'+Object.entries(data).map(([k,v])=>k+': '+v).join('\n'));document.getElementById('requestStatus').textContent='Request downloaded. Send the file to WealthCare to arrange the next step. It has not been sent automatically.'}
function downloadText(name,text){const u=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
formPage=function(kind){return heading(kind==='quote'?'START A PROJECT':kind.toUpperCase(),'Founded and led by Kareem Abdullah. Tell us how you would like to work with WealthCare.')+`<section class="section"><div class="formWrap">${kind==='quote'||kind==='book'?estimateForm():''}${requestForm(kind)}</div></section>`};
function estimateForm(){return `<div class="success"><h3>Plan your landscaping budget</h3><p>Enter the rate discussed with WealthCare and the number of visits. This calculator is a planning estimate; your final quote requires a property review.</p><div class="form"><label>Rate per visit ($)<input id="rate" type="number" min="0" step="0.01" oninput="calculateEstimate()" placeholder="Enter agreed rate"></label><label>Number of visits<input id="visits" type="number" min="1" step="1" value="1" oninput="calculateEstimate()"></label><output class="full" id="estimate" aria-live="polite">Enter a rate to calculate your estimate.</output></div></div><br>`}
function calculateEstimate(){const rate=document.getElementById('rate');const visits=document.getElementById('visits');document.getElementById('estimate').textContent=rate.value&&rate.checkValidity()&&visits.checkValidity()?'Planning estimate: $'+(Number(rate.value)*Number(visits.value)).toFixed(2):'Enter a valid rate and number of visits.'}
donate=function(){return heading("GIVE IT.","Support WealthCare’s community projects and youth activities in Chattanooga.")+`<section class="section"><div class="formWrap"><h2>Choose how to donate</h2><p>Enter the amount you’d like to give. Confirm the recipient is <strong>$4everchosen888</strong> on Cash App or <strong>@jojoicon</strong> on Venmo before sending.</p><div class="actions"><a class="pill green" href="https://cash.app/$4everchosen888" target="_blank" rel="noopener noreferrer">DONATE WITH CASH APP ↗</a><a class="pill green" href="https://venmo.com/u/jojoicon" target="_blank" rel="noopener noreferrer">DONATE WITH VENMO ↗</a><a class="pill" href="#/give-it">BACK TO GIVE IT</a></div></div></section>`};
productPage=function(slug){const item=catalog.find(x=>x[0]===slug);if(!item)return heading('PRODUCT NOT FOUND','Return to the shop to browse the collection.')+'<section class="section"><a class="pill" href="#/shop">BACK TO SHOP</a></section>';return heading(item[1],'I Love Wealth • Wear the message.')+`<section class="section"><div class="featureBand"><div class="featurePhoto" style="background-image:url('${photos.wear}')"></div><div class="featureText"><h3>${item[1]}</h3><p class="price">$${item[2]}</p><p>Collection reference image. Confirm product details and availability with WealthCare before purchasing.</p><label>Size <select id="size" class="pill">${(slug.includes('cap')?['One size']:['S','M','L','XL','2XL']).map(x=>`<option>${x}</option>`).join('')}</select></label><br><button class="pill green" onclick="addCart('${slug}')">ADD TO CART</button><p id="cartStatus" role="status"></p><a href="#/cart">VIEW CART →</a></div></div></section>`};
function addCart(slug){cart.push({slug,size:document.getElementById('size').value});persistCart();document.getElementById('cartStatus').textContent='Added to your cart.'}
function persistCart(){try{localStorage.setItem('wcCart',JSON.stringify(cart))}catch{}}
function cartPage(){let total=0;const rows=cart.map((x,i)=>{const p=catalog.find(p=>p[0]===x.slug);if(!p)return '';total+=p[2];return `<div class="orderRow"><span>${p[1]} • ${esc(x.size)} • $${p[2]}</span><button class="pill" onclick="cart.splice(${i},1);persistCart();app()">Remove</button></div>`}).join('');return heading('YOUR CART','Review your items and confirm your order with WealthCare before paying.')+`<section class="section"><div class="formWrap">${rows||'<p>Your cart is empty.</p>'}<h3>Total: $${total}</h3><div class="actions"><a class="pill" href="#/shop">CONTINUE SHOPPING</a>${rows?'<button class="pill green" onclick="downloadOrder()">DOWNLOAD ORDER REQUEST</button>':''}</div>${rows ? `<h3>Choose how to pay</h3><p>Message WealthCare with your items and sizes to confirm availability, delivery or pickup, and your final total. Then enter that amount and confirm the recipient is <strong>$4everchosen888</strong> on Cash App or <strong>@jojoicon</strong> on Venmo. Share your payment confirmation with WealthCare.</p><div class="actions"><a class="pill" href="https://www.instagram.com/iLovewealth_/" target="_blank" rel="noopener noreferrer">MESSAGE WEALTHCARE ↗</a><a class="pill green" href="https://cash.app/$4everchosen888" target="_blank" rel="noopener noreferrer">PAY WITH CASH APP ↗</a><a class="pill green" href="https://venmo.com/u/jojoicon" target="_blank" rel="noopener noreferrer">PAY WITH VENMO ↗</a></div>` : ""}</div></section>`}
function downloadOrder(){downloadText('WealthCare_Order.txt',cart.map(x=>{const p=catalog.find(p=>p[0]===x.slug);return p?p[1]+' | '+x.size+' | $'+p[2]:''}).join('\n')+'\nOrder request only. No payment or order submission has occurred.')}
const extraPages={'coat-drive':['WINTER COAT DRIVE','Offer clean coats, jackets, hats, gloves, and blankets. Arrange pickup with Kareem before bringing items.'],'food-support':['FOOD SUPPORT','Offer unopened shelf-stable food. Include quantities and expiration dates so we can plan distribution.'],'clothing-support':['CLOTHING & ESSENTIALS','Offer clean clothing, new socks, and hygiene essentials. Tell us sizes and quantities.'],'holiday-support':['SEASONAL GIVING','Offer new toys and useful gifts as part of our wider winter community support.'],'community-projects':['BUILD THE BLOCK UP','Offer supplies, equipment, or time for neighborhood projects.'],'idea':['SHARE AN IDEA','Tell us what would help your neighborhood and how WealthCare could take part.'],'contact':['CONTACT WEALTHCARE','Connect with Kareem on Instagram: iLovewealth_. Arrange a pickup or ask about services before visiting.']};
function openPopup(kind){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.className='modal';d.innerHTML=`<button class="close" aria-label="Close" onclick="this.closest('dialog').close()">×</button><div class="eyebrow">${kind==='give'?'GIVE IT':'BUILD IT'}</div><h2>${kind==='give'?'Help someone this winter.':'Let’s plan your project.'}</h2><p>${kind==='give'?'Food, coats, clothing, and essentials can make a difference. Choose a pledge amount or offer items.':'Tell us the service, property size, and preferred date. We’ll help you prepare your quote request.'}</p><div class="actions"><a class="pill green" href="#/${kind==='give'?'donate':'quote'}" onclick="this.closest('dialog').close()">${kind==='give'?'CHOOSE AN AMOUNT':'PLAN MY QUOTE'}</a><a class="pill" href="#/${kind==='give'?'coat-drive':'services'}" onclick="this.closest('dialog').close()">${kind==='give'?'GIVE ITEMS':'VIEW SERVICES'}</a></div>`;document.body.append(d);d.showModal()}
function app(){clearInterval(slideTimer);document.querySelector('dialog')?.remove();document.getElementById('wcIntro')?.remove();renderOriginal();const r=route();let custom;if(extraPages[r]){const [t,b]=extraPages[r];custom=heading(t,b)+`<section class="section"><div class="formWrap">${r==='contact'?'<a class="pill green" href="https://www.instagram.com/iLovewealth_/" target="_blank" rel="noopener">OPEN INSTAGRAM</a><br><br>':''}${requestForm(t)}</div></section>`}if(r==='cart')custom=cartPage();if(r==='site-map')custom=heading('EXPLORE WEALTHCARE','Choose your next stop.')+`<section class="section"><div class="pathGrid">${['home','wear-it','build-it','give-it','live-it','be-part-of-it','shop','quote','donate','contact'].map(x=>`<a class="path" href="#/${x}">${x.replaceAll('-',' ').toUpperCase()}</a>`).join('')}</div></section>`;if(custom)document.querySelector('main').innerHTML=custom;const menu=document.querySelector('.menu');menu.setAttribute('aria-expanded','false');menu.onclick=()=>{const open=document.querySelector('.navlinks').classList.toggle('open');menu.setAttribute('aria-expanded',String(open))};window.scrollTo(0,0);document.title='WealthCare — '+r.replaceAll('-',' ');if(r==='home'&&!window.givingPromptShown){window.givingPromptShown=true;openPopup('give')}if(r==='build-it')openPopup('build')}

const freshPhotos={"party": "./assets/photo-11.webp", "hair": "./assets/photo-12.webp", "studio": "./assets/photo-13.webp", "learning": "./assets/photo-14.webp", "friends": "./assets/photo-15.webp", "creative": "./assets/photo-16.webp", "mowing": "./assets/photo-17.webp", "gardenwork": "./assets/photo-18.webp", "basketballnew": "./assets/photo-19.webp", "dancing": "./assets/photo-20.webp", "volunteering": "./assets/photo-21.webp", "lawn": "./assets/photo-22.webp"};

function compact(title,desc,next,label){return `<section class="compactTop"><div><div class="eyebrow">WEALTHCARE • CHATTANOOGA</div><h1>${title}</h1><p>${desc}</p></div>${next?`<a class="pill green" href="#/${next}">${label} →</a>`:''}</section>`}
function photoCards(cards){return `<div class="photoGrid">${cards.map(([title,text,image,route])=>`<a class="photoCard" href="#/${route}"><img src="${image}" alt="${esc(title)}" loading="lazy"><div class="caption"><h3>${title}</h3><p>${text}</p><span class="go">EXPLORE →</span></div></a>`).join('')}</div>`}
function photoNote(){return '<p class="editorialNote">Lifestyle imagery illustrates the WealthCare vision. These photos are not a record of completed WealthCare events or projects.</p>'}
const originalHome=home;
home=function(){return originalHome()+`<section class="section homeLife"><div class="sectionTitle"><div><div class="eyebrow">PEOPLE. IDEAS. EVERYDAY LIFE.</div><h2>A world worth being part of.</h2></div><p>We lead. We build. We care. Founded and led by Kareem Abdullah.</p></div><div class="photoStrip">${[freshPhotos.learning,freshPhotos.studio,freshPhotos.hair,freshPhotos.party].map((p,i)=>`<a href="#/live-it"><img src="${p}" alt="${['Learning together','Creating music','Hair and creativity','Friends celebrating'][i]}" loading="lazy"></a>`).join('')}</div>${photoNote()}</section>`};
build=function(){return compact('Landscaping & property care','Explore services, plan your project, and put care into your outdoor space.','quote','GET A QUOTE')+`<section class="section">${photoCards([['Lawn care','Mowing, edging, and regular yard upkeep.',freshPhotos.lawn,'build/lawn-care'],['Hedges & shrubs','Shape overgrown spaces and refresh the front of your property.',photos.build,'build/hedges'],['Planting & gardens','Bring color, greenery, and fresh ideas to your outdoor space.',photos.garden,'build/planting'],['Cleanups','Clear the clutter and make space for what comes next.',freshPhotos.gardenwork,'build/cleanup'],['Hands-on learning','Practical skills, equipment care, and teamwork.',freshPhotos.mowing,'jobs'],['Community spaces','Talk with us about a project for your neighborhood.',photos.hero[4],'community-projects']])}${photoNote()}</section><section class="section blue"><div class="sectionTitle"><div><div class="eyebrow">YOUR PROPERTY. YOUR PLAN.</div><h2>Tell us what needs doing.</h2></div><p>Include the service, property size, and preferred date. A property review helps determine the final quote.</p></div><div class="actions"><a class="pill green" href="#/quote">PLAN MY QUOTE</a><a class="pill" href="#/book">REQUEST A VISIT</a></div></section>`};
const originalWear=wear;
wear=function(){let s=originalWear();s=s.replace(/<section class="shopHero">[\s\S]*?<\/section>/,compact('The collection','I Love Wealth. Clothing, identity, and everyday style.','cart','VIEW CART'));s=s.replace(/<div class="sectionTitle">[\s\S]*?<\/div><div class="products">/,'<div class="products">');return s+`<section class="section blue"><div class="sectionTitle"><div><div class="eyebrow">BEHIND THE STYLE</div><h2>Make it yours.</h2></div><p>Friendship, confidence, and creative expression are part of the message.</p></div><div class="photoStrip">${[photos.wear,freshPhotos.friends,freshPhotos.creative,freshPhotos.party].map((p,i)=>`<img src="${p}" alt="${['Existing WealthCare collection image','Friendship and identity','Creative expression','Everyday life'][i]}" loading="lazy">`).join('')}</div>${photoNote()}</section>`};
give=function(){return compact('Community giving','Helping people in need throughout winter through food, clothing, essentials, and shared effort.','donate','MAKE A PLEDGE')+`<section class="section">${photoCards([['Food & essentials','Offer unopened food and useful everyday supplies.',freshPhotos.volunteering,'food-support'],['Warm clothing','Coats, hats, gloves, and blankets for colder days.',photos.give,'coat-drive'],['Give your time','Help organize, pack, and prepare community support.',freshPhotos.friends,'volunteer'],['Toys & seasonal support','Include something joyful alongside practical help.',photos.hero[3],'holiday-support'],['Neighborhood projects','Share supplies, equipment, or a helping hand.',photos.garden,'community-projects'],['Local partnerships','Small businesses and neighbors can build something together.',freshPhotos.learning,'partner']])}${photoNote()}</section>`};
live=function(){return compact('Youth, creativity & everyday life','Find a mix of skills, movement, friendships, and new experiences. Explore your interests and ask about opportunities.','join-youth','GET INVOLVED')+`<section class="section">${photoCards([['Sports & movement','Basketball, fitness, teamwork, and time outdoors.',freshPhotos.basketballnew,'activity/sports'],['Music & studio time','Writing, recording, production, and finding your voice.',freshPhotos.studio,'skill/music'],['Hair, beauty & style','Hands-on creativity, self-expression, and useful skills.',freshPhotos.hair,'skill/hair-and-beauty'],['Learning & mentorship','Study together, ask questions, and build confidence.',freshPhotos.learning,'skill/life-skills'],['Friends & celebrations','Connection, laughter, dance, and shared moments.',freshPhotos.dancing,'activity/social'],['Cooking & food','Try recipes and build skills you can use every day.',photos.cooking,'activity/cooking'],['Art, media & technology','Create something, tell a story, and explore ideas.',freshPhotos.creative,'skill/media'],['Outdoor adventures','Swimming, trips, and experiences beyond the everyday.',photos.swim,'trips'],['Business & work','Learn to earn, plan, and build with a team.',freshPhotos.friends,'skill/business'],['Build something','Landscaping, practical projects, and hands-on learning.',photos.build,'activity/build'],['Help somebody','Make care part of everyday life.',photos.give,'activity/help'],['Celebrate community','Bring people together and make good memories.',freshPhotos.party,'be-part-of-it']])}${photoNote()}</section>`};
const priorApp=app;
app=function(){window.givingPromptShown=true;const oldOpen=openPopup;openPopup=()=>{};priorApp();openPopup=oldOpen;document.querySelector('main').setAttribute('id','main-content');document.querySelector('.nav').insertAdjacentHTML('afterbegin','<a class="skipLink" href="#main-content" onclick="event.preventDefault();document.querySelector(\'main\').scrollIntoView()" style="position:absolute;left:-10000px">Skip to content</a>')};


const missionHome=home;
function missionBlock(){return `<section class="section"><div class="sectionTitle"><div><div class="eyebrow">FOUNDED & LED BY KAREEM • 17 • CHATTANOOGA</div><h2>Talent is everywhere.<br>Opportunity should be, too.</h2></div><p>WealthCare is building a place where young people can earn, create, belong, and lead. Different backgrounds. Different ambitions. A shared chance to build something.</p></div><div class="featureBand" style="border-radius:24px;overflow:hidden"><div class="featurePhoto" style="background-image:url('${freshPhotos.friends}')" role="img" aria-label="Young people together; illustrative lifestyle photo"></div><div class="featureText"><div class="eyebrow">A NOTE FROM KAREEM</div><h3>Give us a chance.<br>Watch what we build.</h3><p>I’m 17, and I’m building WealthCare here in Chattanooga. Some young people want a positive direction. Some want to start businesses. Others want somewhere to learn, create, and meet people who believe in them.</p><p>Our next step is organizing a dependable yard-cleanup crew and building paid work and learning opportunities. We’re starting small, with real work and clear goals.</p><div class="actions"><a class="pill green" href="#/build-it">HIRE WEALTHCARE</a><a class="pill" href="#/join-youth">FIND MY PLACE</a></div></div></div></section><section class="section blue"><div class="sectionTitle"><div><div class="eyebrow">KNOW THE FACES. FOLLOW THE GROWTH.</div><h2>Be part of the chance.</h2></div><p>Follow the journey as we build our first crew, learn together, and work toward our first customer bookings.</p></div><div class="pathGrid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><a class="path" href="#/quote"><b>Book a service</b><span>Request a yard-cleanup quote. We confirm scope, crew availability, and price before booking.</span></a><a class="path" href="#/join-youth"><b>Bring your ambition</b><span>Tell us what you want to learn, create, or build.</span></a><a class="path" href="#/partner"><b>Open a door</b><span>Offer equipment, space, a skill, or a clearly defined sponsorship.</span></a><a class="path" href="https://www.instagram.com/iLovewealth_/" target="_blank" rel="noopener"><b>Follow our beginning</b><span>Meet the founder and watch for real crew updates on Instagram.</span></a></div><p class="editorialNote">WealthCare is a community group. Planned opportunities are being developed; member stories and results will be shared only with permission and after they happen.</p></section>`}
home=function(){const content=missionHome();const pos=content.indexOf('</section>')+10;return content.slice(0,pos)+missionBlock()+content.slice(pos)};
const missionLive=live;
live=function(){return `<section class="compactTop"><div><div class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</div><h1>Bring your thing.<br>Find your people.</h1><p>Make something. Learn something. Meet your people. Bring what you love—and tell us what you’ve always wanted to try.</p></div><a class="pill green" href="#/join-youth">FIND MY PLACE →</a></section><section class="section blue"><div class="sectionTitle"><div><h2>A little of what we’re building.</h2></div><p>Creative experiences, useful skills, friendships, community, and opportunities to grow. Join the interest list while we develop the program; schedules, costs, and places are not confirmed yet.</p></div></section>`+missionLive().replace(/<section class="compactTop">[\s\S]*?<\/section>/,'')};
function youthInterest(){return compact('Let’s make moves.','You don’t need it all figured out. Tell us a little about yourself and what you’d like to be part of.','','')+`<section class="section"><div class="formWrap"><form class="form" onsubmit="saveRequest(event,'WealthCare youth interest')"><label>What should we call you?<input name="name" autocomplete="given-name" required></label><label>How old are you?<input name="age" type="number" min="14" max="19" required></label><label class="full">What’s your thing?<select name="interest"><option>Still finding my thing</option><option>Music & studio</option><option>Hair, beauty & style</option><option>Business & paid work</option><option>Sports & movement</option><option>Art, media & technology</option><option>Outdoor experiences</option><option>Community & leadership</option></select></label><label class="full">What have you always wanted to try?<textarea name="goals" placeholder="A skill, a business idea, an adventure—tell us."></textarea></label><label class="full">How can we reach you or your parent/guardian?<input name="contact" required placeholder="Email or phone"></label><p class="full">If you’re under 18, involve your parent or guardian. This is an interest request, not enrollment; we’ll need confirmed program details and guardian permission before participation.</p><button class="pill green full">SAVE MY INTEREST REQUEST →</button><div class="full" id="requestStatus" role="status"></div><p class="full">This file downloads your request; it does not send it. Contact Kareem through <a href="https://www.instagram.com/iLovewealth_/" target="_blank" rel="noopener" style="text-decoration:underline">WealthCare’s Instagram</a> to arrange the next step. Avoid sharing private details in public comments.</p></form></div></section>`}
const missionApp=app;
app=function(){missionApp();if(route()==='join-youth'){document.querySelector('main').innerHTML=youthInterest();window.scrollTo(0,0)}};

const campaignCards = [
  ['Food & Toys', photos.give, 'food-and-toys', 'Offer pantry food or new toys for Chattanooga kids and families.'],
  ['Community Projects', photos.garden, 'community-projects'],
  ['Equipment for Coaches', photos.hero[1], 'coach-equipment', 'Help coaches equip practices with basketballs, cones, and other youth sports supplies.'],
  ['STEM & Landscaping', photos.robotics, 'hands-on-learning', 'Support science activities, tools, and practical landscaping lessons for local youth.']
];
for (const [title, , slug, description] of campaignCards) {
  if (description) extraPages[slug] = [title, description];
}
const doors = [
  ['Build It', 'build-it', freshPhotos.mowing],
  ['Live It', 'live-it', photos.hero[3]],
  ['Wear It', 'wear-it', photos.wear],
  ['Give It', 'give-it', photos.give]
];
home = function () {
  const originalEntrance = originalHome().split('</section>')[0] + '</section>';
  return originalEntrance
    .replace(/<div class="sideNote"[^>]*>[\s\S]*?<\/div>/g, '')
    .replace(/<div class="tagline">[^<]*<\/div>/, '')
    .replace(/<a class="pill" href="#\/be-part-of-it">BE PART OF IT<\/a>/, '')
    .replace(/<div class="worldDock">[\s\S]*?(?=<\/div><\/section>$)/, '')
    .replace('ENTER THE WORLD →', 'Step Into My World →');
};
world = function () {
  return `<section class="wcDoors" aria-label="Explore WealthCare"><h1>Step Into <em>My World.</em></h1>${doors.map(([title, slug, image]) => `<a href="#/${slug}" class="wcDoor"><img src="${image}" alt=""><strong>${title} <span aria-hidden="true">↗</span></strong></a>`).join('')}</section>`;
};
give = world;

function showCampaign() {
  const sales = 500;
  const goal = 10000;
  const dialog = document.createElement('dialog');
  dialog.className = 'wcCampaign';
  dialog.setAttribute('aria-labelledby', 'campaign-title');
  dialog.innerHTML = `<button class="wcClose" aria-label="Close Give It" autofocus>×</button>
    <h1 id="campaign-title">Give <span>It</span></h1>
    <p>$${sales.toLocaleString('en-US')} in sales toward our $${goal.toLocaleString('en-US')} monthly goal</p>
    <div class="wcMeter"><progress aria-label="Monthly sales progress" value="${sales}" max="${goal}"></progress><strong>${sales / goal * 100}%</strong></div>
    <div class="wcCampaignGrid">${campaignCards.map(([title, image, slug]) => `<a href="#/${slug}" class="wcDoor"><img src="${image}" alt=""><strong>${title} <span aria-hidden="true">↗</span></strong></a>`).join('')}</div>
    <div class="wcCampaignActions"><a class="pill green" href="#/wear-it">Shop to Support →</a><a class="pill wcDonate" href="#/donate">Donate</a></div>
    <small>Illustrative photos</small>`;
  dialog.querySelector('.wcClose').onclick = () => dialog.close();
  dialog.addEventListener('close', () => {
    if (route() === 'give-it') {
      go('world');
      requestAnimationFrame(() => document.querySelector('.wcDoors a[href="#/give-it"]')?.focus());
    }
  });
  document.body.append(dialog);
  dialog.showModal();
}

function showClothingRequest() {
  const dialog = document.createElement('dialog');
  dialog.className = 'wcCampaign wcClothing';
  dialog.setAttribute('aria-labelledby', 'clothing-title');
  dialog.innerHTML = `<button class="wcClose" aria-label="Close" autofocus>×</button>
    <h1 id="clothing-title">What do you want to wear?</h1>
    <form onsubmit="saveClothingRequest(event)">
      <label>What clothing do you need?<textarea name="clothing" required placeholder="Styles, sizes, and what you’ll use them for"></textarea></label>
      <label>Reference photos <input type="file" name="photos" accept="image/*" multiple></label>
      <p>Your request downloads as a text file. Share your photos separately with WealthCare.</p>
      <button class="pill green">Download clothing request</button>
      <a class="pill wcDonate" href="#/quote">Landscaping quote</a>
      <p role="status" id="clothing-status"></p>
    </form>`;
  dialog.querySelector('.wcClose').onclick = () => dialog.close();
  dialog.addEventListener('close', () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
}
function saveClothingRequest(event) {
  event.preventDefault();
  const data = new FormData(event.currentTarget);
  const filenames = data.getAll('photos').map(file => file.name).filter(Boolean);
  downloadText('WealthCare_Clothing_Request.txt', 'Free clothing request\n' + data.get('clothing') + (filenames.length ? '\nReference photos to share: ' + filenames.join(', ') : ''));
  document.getElementById('clothing-status').textContent = 'Request downloaded. Contact WealthCare to share it.';
}
const renderWealthCarePages = app;
app = function () {
  renderWealthCarePages();
  const current = route();
  document.body.classList.toggle('wcOpening', current === 'home');
  document.body.classList.toggle('wcInside', current !== 'home');
  if (current === 'home') startHomeSlides();
  if (current === 'give-it') showCampaign();
  if (current === 'build-it') showClothingRequest();
};


window.addEventListener('hashchange',app);window.addEventListener('DOMContentLoaded',app);
</script>
</body>
</html>
