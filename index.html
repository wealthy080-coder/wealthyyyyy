function interact(){if(dialog)return;if(emergencyPhase==='scavenge'){collectNearby();return;}if(driving){toast('Press F to exit the car.');return;}const p=player.g.position;const dist=(x,z)=>Math.hypot(p.x-x,p.z-z);if(stage===0&&dist(4,-13)<6){stage=1;p.set(5,0,-43);save();ui();open('Welcome to WealthCare Academy!','Find Coach Ace in the courtyard classroom. Press E near the teacher.')}else if(stage===1&&dist(7,-48)<7){stage=2;save();ui();open('Coach Ace','Today we are learning percentages! A 20% discount means you save $20 for every $100.',[['Start lesson',()=>{quiz=0;lesson()}]])}else if(stage===2&&dist(7,-48)<7)lesson();else if(stage===3&&dist(34,10)<7){stage=4;xp+=75;cash-=73;save();ui();open('Campus Store · Success!','Backpack $60 − 20% ($12) = $48. Add $25 = $73. You earned 75 XP!')}else if(stage===4&&dist(-36,17)<7){scienceIndex=0;open('Dr. Nova · Science Lab','Welcome to Science Discovery! Investigate plants, fair experiments, and the energy that powers ecosystems.',[['Start science challenge',()=>scienceLesson()]])}else if(dist(8,-8)<5)open('Campus Guide','Head toward the big academy building and look for the green entrance.');else open('Explore Wealth City','Find the academy, Coach Ace, the campus store, Dr. Nova, or the green car. Follow the mission text in the upper left.')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact();if(e.key===' '&&!jumping&&!driving){vy=8;jumping=true}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#act').onclick=interact;document.querySelector('#jump').onclick=()=>{if(!jumping&&!driving){vy=8;jumping=true}};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});let drag=false,lastX=0,lastY=0,pitch=.32,cameraDistance=8,moveVX=0,moveVZ=0;
renderer.domElement.style.touchAction='none';
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};
renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>drag=false;
renderer.domElement.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.003,-.12,.95);lastX=e.clientX;lastY=e.clientY};
renderer.domElement.onwheel=e=>{e.preventDefault();cameraDistance=THREE.MathUtils.clamp(cameraDistance+Math.sign(e.deltaY)*1.2,4,16)};
addEventListener('blur',()=>{drag=false;for(const k in keys)keys[k]=false});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.repeat&&emergencyPhase!=='shelter')toggleCar()});

const emergencyHud=document.querySelector('#emergencyHud'),survivalOverlay=document.querySelector('#survival'),survivalCard=document.querySelector('#survivalCard'),recordEl=document.querySelector('#record');
let emergencyPhase='free',emergencyTimer=60,nextEmergency=90+Math.random()*90,survivalDay=1,food=0,water=0,health=100,morale=75,bag=0,daysRecord=Number(localStorage.getItem('wc-blackout-best')||0),rescued=[],journal=[];
const supplyDefinitions=[['Water',-8,9,2],['Food',17,13,2],['First aid',-31,18,2],['Batteries',-9,-13,1],['Toolbox',24,-5,2],['Water',-23,-37,2],['Food',-4,-43,2]];
const supplies=supplyDefinitions.map(([name,x,z,slots])=>{const color=name==='Water'?0x4ba9ee:name==='Food'?0xf3b753:name==='First aid'?0xe45d67:name==='Batteries'?0xe5dc4c:0x7ca0a0;const mesh=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.15,1.15),mat(color));mesh.position.set(x,.65,z);scene.add(mesh);return{name,slots,mesh,taken:false}});
const shelterMarker=new THREE.Mesh(new THREE.ConeGeometry(1.6,3,5),mat(0xf6e489));shelterMarker.position.set(-4,5,-9);shelterMarker.visible=false;scene.add(shelterMarker);
function recordUpdate(){recordEl.textContent='Blackout best: '+daysRecord+' days'}recordUpdate();
function startEmergency(){if(emergencyPhase!=='free')return;if(driving)toggleCar();if(dialog)close();emergencyPhase='scavenge';emergencyTimer=60;bag=0;rescued=[];food=0;water=0;health=100;morale=75;survivalDay=1;journal=[];supplies.forEach(s=>{s.taken=false;s.mesh.visible=true});shelterMarker.visible=true;scene.background.set(0x4b5265);scene.fog.color.set(0x4b5265);cityLights.forEach(l=>l.material.emissiveIntensity=0);toast('BLACKOUT! Collect supplies and reach the academy shelter!');speak('Emergency alert. Citywide blackout. Sixty seconds to collect supplies and reach the academy shelter.')}
function collectNearby(){const p=player.g.position;const nearby=supplies.find(s=>!s.taken&&Math.hypot(p.x-s.mesh.position.x,p.z-s.mesh.position.z)<3.2);if(nearby){if(bag+nearby.slots>10){toast('Backpack full!');return}nearby.taken=true;nearby.mesh.visible=false;bag+=nearby.slots;if(nearby.name==='Water')water+=3;if(nearby.name==='Food')food+=3;if(nearby.name==='First aid')health=Math.min(100,health+15);if(nearby.name==='Batteries')morale=Math.min(100,morale+10);toast('Collected '+nearby.name+' ('+bag+'/10 slots)');return}
for(const [name,npc] of [['Marcus',guide],['Coach Ace',teacher],['Dr. Nova',scientist]]){if(!rescued.includes(name)&&Math.hypot(p.x-npc.g.position.x,p.z-npc.g.position.z)<4){rescued.push(name);toast(name+' is following you to safety!');return}}toast('Move closer to a supply box or person and press E.')}
function updateEmergency(dt){if(emergencyPhase==='free'){if(!dialog){nextEmergency-=dt;if(nextEmergency<=0)startEmergency()}return}if(emergencyPhase!=='scavenge')return;if(!dialog)emergencyTimer=Math.max(0,emergencyTimer-dt);
const p=player.g.position;emergencyHud.style.display='block';emergencyHud.textContent='⚡ BLACKOUT '+Math.ceil(emergencyTimer)+'s | Bag '+bag+'/10 | Rescued '+rescued.length+' | E collect | Shelter: academy door';
supplies.forEach(s=>{if(!s.taken)s.mesh.rotation.y+=dt});shelterMarker.rotation.y+=dt;
const atShelter=Math.hypot(p.x+4,p.z+9)<5;if(atShelter||emergencyTimer<=0){emergencyPhase='shelter';shelterMarker.visible=false;emergencyHud.style.display='none';if(!atShelter){health-=20;morale-=15;journal.push('Arrived late and lost 20 health.')}journal.push('Entered shelter with '+food+' food, '+water+' water and '+rescued.length+' companions.');showShelter()}}
function shelterFinish(){emergencyPhase='free';survivalOverlay.style.display='none';scene.background.set(0x94c9ef);scene.fog.color.set(0x94c9ef);cityLights.forEach(l=>l.material.emissiveIntensity=.9);nextEmergency=180+Math.random()*180;player.g.position.set(0,0,8);const days=Math.max(0,survivalDay-1);daysRecord=Math.max(daysRecord,days);localStorage.setItem('wc-blackout-best',String(daysRecord));recordUpdate();supplies.forEach(s=>s.mesh.visible=false);toast('Survived '+days+' days! Best: '+daysRecord);speak('Survival run complete. You survived '+days+' days.')}
function shelterAction(action){let note='';const people=1+rescued.length;
if(action==='ration'){food=Math.max(0,food-1);water=Math.max(0,water-1);health-=food===0||water===0?18:5;morale-=7;note='Rationed supplies.'}
if(action==='feed'){food=Math.max(0,food-people);water=Math.max(0,water-people);health+=food>0&&water>0?10:-18;morale+=5;note='Shared meals and water.'}
if(action==='search'){if(Math.random()<.62){food+=1+Math.floor(Math.random()*3);water+=1+Math.floor(Math.random()*3);note='Supply run succeeded.'}else{health-=14;note='Supply run failed.'}morale-=3}
if(action==='repair'){if(rescued.includes('Dr. Nova')||rescued.includes('Coach Ace')){water+=2;morale+=5;note='Team repaired the water filter.'}else{health-=7;note='Repair attempt failed.'}}
health=Math.max(0,Math.min(100,health));morale=Math.max(0,Math.min(100,morale));journal.push('Day '+survivalDay+': '+note);survivalDay++;daysRecord=Math.max(daysRecord,survivalDay-1);localStorage.setItem('wc-blackout-best',String(daysRecord));recordUpdate();showShelter()}
function showShelter(){survivalOverlay.style.display='flex';const finished=health<=0;const heading=document.createElement('h2');heading.textContent=finished?'Survival run ended':'⚡ Blackout — Day '+survivalDay;survivalCard.replaceChildren(heading);
const info=document.createElement('p');info.textContent='Food '+food+' | Water '+water+' | Health '+health+' | Morale '+morale+' | Survivors: '+(rescued.join(', ')||'You alone')+' | Best '+daysRecord+' days';survivalCard.append(info);
const story=document.createElement('p');story.textContent=finished?'Your group could not continue. You survived '+(survivalDay-1)+' days.':survivalDay%4===0?'A visitor asks for help while the city remains without power. How will you manage today?':'Your shelter needs a plan for the next day. Supplies are limited and the blackout continues.';survivalCard.append(story);
function option(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;survivalCard.append(b)}
if(finished){option('Return to Wealth City',shelterFinish)}else{option('Ration supplies',()=>shelterAction('ration'));option('Full portions',()=>shelterAction('feed'));option('Send supply expedition',()=>shelterAction('search'));option('Repair water filter',()=>shelterAction('repair'));option('End run and return to city',shelterFinish)}
const log=document.createElement('p');log.style.fontSize='12px';log.textContent='Journal: '+journal.slice(-5).join(' | ');survivalCard.append(log)}
document.querySelector('#testEmergency').onclick=()=>{if(emergencyPhase==='free')startEmergency();else toast('Finish the current emergency first')};supplies.forEach(s=>s.mesh.visible=false);

function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),p=player.g.position;updateEmergency(dt);drawMap();if(driving&&!dialog){const throttle=(keys.w?1:0)-(keys.s?1:0);carSpeed+=throttle*13*dt;carSpeed*=Math.pow(keys[' ']?.75:.985,dt*60);carSpeed=THREE.MathUtils.clamp(carSpeed,-8,22);const steer=(keys.a?1:0)-(keys.d?1:0);carAngle+=steer*dt*1.3*(carSpeed/12);car.rotation.y=carAngle;const nx=car.position.x-Math.sin(carAngle)*carSpeed*dt,nz=car.position.z-Math.cos(carAngle)*carSpeed*dt;if(Math.abs(nx)<85&&Math.abs(nz)<85&&!buildings.some(b=>nx>b.x-b.w/2-2&&nx<b.x+b.w/2+2&&nz>b.z-b.d/2-2&&nz<b.z+b.d/2+2)){car.position.x=nx;car.position.z=nz}else carSpeed=0;p.x=car.position.x;p.z=car.position.z;}let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0);
const moving=!!(dx||dz),canWalk=!dialog&&!driving&&emergencyPhase!=='shelter';
if(moving){const len=Math.hypot(dx,dz);dx/=len;dz/=len}
const targetVX=canWalk?(dx*Math.cos(yaw)+dz*Math.sin(yaw))*(keys.shift?10:5.5):0;
const targetVZ=canWalk?(-dx*Math.sin(yaw)+dz*Math.cos(yaw))*(keys.shift?10:5.5):0;
const blend=1-Math.exp(-dt*(moving?11:16));moveVX=THREE.MathUtils.lerp(moveVX,targetVX,blend);moveVZ=THREE.MathUtils.lerp(moveVZ,targetVZ,blend);
if(canWalk){const nx=p.x+moveVX*dt,nz=p.z+moveVZ*dt;
const hit=buildings.some(b=>nx>b.x-b.w/2-.55&&nx<b.x+b.w/2+.55&&nz>b.z-b.d/2-.55&&nz<b.z+b.d/2+.55);
if(!hit&&Math.abs(nx)<90&&Math.abs(nz)<90){p.x=nx;p.z=nz}else{moveVX=0;moveVZ=0}
if(Math.hypot(moveVX,moveVZ)>.15){const face=Math.atan2(moveVX,moveVZ);player.g.rotation.y+=Math.atan2(Math.sin(face-player.g.rotation.y),Math.cos(face-player.g.rotation.y))*Math.min(1,dt*12)}
}
vy-=20*dt;p.y=driving?0:Math.max(0,p.y+vy*dt);if(p.y===0){vy=0;jumping=false}const t=performance.now()*.012;player.limbs.forEach((l,i)=>l.rotation.x=moving&&!dialog?Math.sin(t+(i%2)*Math.PI)*(keys.shift?.72:.48):0);player.g.rotation.z=moving&&!dialog?Math.sin(t*2)*.018:0;teacher.limbs[3].rotation.z=Math.sin(t*.22)*.35-.5;scientist.limbs[2].rotation.z=Math.sin(t*.3)*.25+.4;labMarker.rotation.y+=dt*.7;labMarker.position.y=9.7+Math.sin(t*.15)*.3;const target=driving?car.position:p;const dist=driving?Math.max(cameraDistance,11):cameraDistance;
const behind=new THREE.Vector3(Math.sin(yaw)*dist*Math.cos(pitch),2.1+dist*Math.sin(pitch),Math.cos(yaw)*dist*Math.cos(pitch));
const desired=target.clone().add(behind);camera.position.lerp(desired,1-Math.exp(-dt*9));camera.lookAt(target.x,target.y+(driving?1.3:1.8),target.z);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
