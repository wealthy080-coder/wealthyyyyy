<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WealthCare Academy — First Day</title><style>
*{box-sizing:border-box}body{margin:0;background:#111d26;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block}#hud{position:fixed;top:14px;left:14px;background:#10231ddc;border:1px solid #5cb88b;border-radius:12px;padding:14px;max-width:350px;pointer-events:none}h1{font-size:19px;margin:0 0 7px;color:#7ce9a5}#mission{font-size:14px;line-height:1.45}#help{position:fixed;bottom:12px;left:12px;background:#10231ddc;padding:9px 13px;border-radius:9px;font-size:12px}#panel{position:fixed;inset:0;background:#071510c9;display:none;align-items:center;justify-content:center;padding:16px}#card{width:min(460px,100%);background:#f6f8f2;color:#1a3028;border-radius:16px;padding:25px;box-shadow:0 15px 60px #0007}button{cursor:pointer;border:0;background:#147c51;color:white;padding:12px 16px;margin:5px;border-radius:8px;font-weight:700}button:hover{background:#0d5a3b}#choices button{display:block;width:100%;margin:8px 0;text-align:left}#status{margin-top:10px;font-weight:700}#mobile{position:fixed;right:10px;bottom:12px;display:flex;gap:4px;flex-wrap:wrap;max-width:270px;justify-content:end}#mobile button{padding:12px;opacity:.86}@media(min-width:900px){#mobile{display:none}}</style></head><body>
<div id="hud"><h1>WEALTHCARE ACADEMY</h1><div id="stats">XP 0 · $100</div><div id="mission">Mission: Visit the academy's green entrance.</div></div><div id="help">WASD move · Shift run · Space jump · E interact · drag to rotate camera</div><div id="mobile"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button id="act">INTERACT</button><button id="jump">JUMP</button></div><div id="panel"><div id="card"><h2 id="heading"></h2><p id="message"></p><div id="choices"></div><div id="status"></div><button id="close">Close</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x94c9ef);scene.fog=new THREE.Fog(0x94c9ef,75,175);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x617b55,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-25,55,25);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const green=mat(0x19824d),dark=mat(0x243e40),skin=mat(0x956c50),blue=mat(0x416cc4),white=mat(0xf0ede3);
function cube(w,h,d,c,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
cube(190,.3,190,mat(0x7dbf79),0,-.2,0);cube(11,.05,140,mat(0x454b50),-15,.02,0);cube(150,.05,10,mat(0x454b50),0,.025,20);cube(12,.07,140,mat(0xb6b5a5),-6,.03,0);
const buildings=[{x:4,z:-23,w:23,d:17,h:12,c:0xf0d5a0},{x:34,z:4,w:17,d:14,h:9,c:0xd4a1a0},{x:-38,z:-27,w:16,d:16,h:14,c:0x96b8c5},{x:37,z:-38,w:19,d:16,h:11,c:0xc3b9d8}];for(const b of buildings){cube(b.w,b.h,b.d,mat(b.c),b.x,b.h/2,b.z);cube(b.w+1,.7,b.d+1,dark,b.x,b.h+.35,b.z);for(let j=-1;j<=1;j++)cube(2,2,.1,mat(0x90d6e7),b.x+j*5,6,b.z+b.d/2+.06)}
cube(5,7,.2,green,4,3.5,-14.35);cube(5,1,.3,white,4,8,-14.25);
cube(2,3,.3,mat(0xf3ce7a),34,1.5,11.1);
// Science Discovery Lab: a second explorable learning destination
cube(17,8,13,mat(0x8dc7d6),-36,4,8);cube(18,.7,14,dark,-36,8.35,8);cube(4,5,.25,mat(0x36b4a1),-36,2.5,14.65);cube(6,1,.4,white,-36,7,14.8);
for(const x of [-42,-30])cube(2.7,2.6,.2,mat(0xbcefff),x,5,14.72);
const labMarker=new THREE.Mesh(new THREE.OctahedronGeometry(1.1),mat(0x45f6c0));labMarker.position.set(-36,9.7,15);scene.add(labMarker);
function tree(x,z){cube(.7,3,.7,mat(0x715038),x,1.5,z);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.3,10,8),green);crown.position.set(x,4.3,z);scene.add(crown)}for(let i=0;i<12;i++)tree(-40+i*7,35);for(let i=0;i<8;i++)tree(52,-38+i*10);
function person(x,z,shirt){
const g=new THREE.Group(),limbs=[];const add=(geo,material,x,y,z,parent=g)=>{const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o};
const trousers=mat(0x26364b),shoes=mat(0x171c26),hair=mat(0x241d1c);
add(new THREE.CylinderGeometry(.38,.44,1.12,12),shirt,0,1.65,0);
add(new THREE.SphereGeometry(.38,16,12),skin,0,2.54,0);
add(new THREE.SphereGeometry(.39,16,10,0,Math.PI*2,0,Math.PI*.43),hair,0,2.66,0);
for(const xx of [-.15,.15])add(new THREE.SphereGeometry(.035,8,6),dark,xx,2.56,.345);
add(new THREE.BoxGeometry(.18,.035,.025),dark,0,2.39,.356);
for(const [xx,yy,hh,arm] of [[-.23,1.1,1.03,false],[.23,1.1,1.03,false],[-.48,2.04,.84,true],[.48,2.04,.84,true]]){
const pivot=new THREE.Group();pivot.position.set(xx,yy,0);g.add(pivot);limbs.push(pivot);
add(new THREE.CapsuleGeometry(arm?.13:.16,hh-.28,4,8),arm?shirt:trousers,0,-hh/2,0,pivot);
if(arm)add(new THREE.SphereGeometry(.13,8,8),skin,0,-hh+.05,0,pivot);
else add(new THREE.BoxGeometry(.31,.17,.48),shoes,0,-hh+.04,.12,pivot);
}g.position.set(x,0,z);scene.add(g);return {g,limbs}
}
// Open-air interactive classroom, with a blackboard, desks and lesson space
cube(21,.2,16,mat(0xd5b98b),5,.05,-48);cube(15,4,.25,mat(0x24483c),5,3,-56.1);cube(15,.3,.45,white,5,5.1,-55.9);
for(const x of [-1,4,9])for(const z of [-46,-41]){cube(2.6,.16,1.4,mat(0xb88954),x,1.2,z);cube(.16,1.2,.16,dark,x-1, .6,z);cube(.16,1.2,.16,dark,x+1,.6,z)}
// Visual wayfinding labels and mission markers
function sign(label,x,y,z,w=8){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#173d33';ctx.fillRect(0,0,512,128);ctx.fillStyle='#e8ffe9';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillText(label,256,77);const texture=new THREE.CanvasTexture(c);const o=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}));o.position.set(x,y,z);scene.add(o)}
sign('WEALTHCARE ACADEMY',4,10,-14,14);sign('CAMPUS STORE',34,6,11.4,10);sign('SCIENCE LAB',-36,6,14.9,9);sign('MATH CLASSROOM',5,6,-56,11);
for(let i=0;i<12;i++){cube(.28,.05,2,white,-15,.08,-50+i*8)}
for(const x of [-3,15]){cube(.15,4,.15,dark,x,2,-12);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.42,10,8),mat(0xfff2bd));lamp.position.set(x,4.2,-12);scene.add(lamp)}
const player=person(0,8,blue),guide=person(8,-8,green),teacher=person(7,-48,blue),scientist=person(-36,17,white);
const keys={},clock=new THREE.Clock();let yaw=0,vy=0,jumping=false,stage=+(localStorage.getItem('wc-stage')||0),xp=+(localStorage.getItem('wc-xp')||0),cash=100,quiz=0,dialog=false;const hud=document.querySelector('#mission'),stats=document.querySelector('#stats');const scienceQuestions=[['What does a plant absorb from the air?',['Carbon dioxide','Sand','Plastic'],0],['Which variable should stay the same in a fair experiment?',['Everything except the factor being tested','Nothing','The final result'],0],['What supplies most energy to Earth’s ecosystems?',['The Sun','The Moon','Rocks'],0]];let scienceIndex=0;
const questions=[['What is 20% of $60?',['$12','$20','$6'],0],['A $60 backpack is 20% off. New price?',['$48','$52','$40'],0],['Add a $25 notebook set to that backpack. Total?',['$73','$85','$68'],0]];
function save(){localStorage.setItem('wc-stage',stage);localStorage.setItem('wc-xp',xp)}function ui(){stats.textContent='XP '+xp+' · $'+cash;hud.textContent=['Mission: Reach the green academy door and press E.','Mission: Meet Coach Ace inside the classroom.','Mission: Complete Coach Ace’s percentage lesson.','Mission: Visit the campus store and press E.','Mission: Find the Science Lab west of campus.','Chapter 2 complete! Explore Wealth City.'][Math.min(stage,5)]}ui();
function open(title,message,options=[]){dialog=true;document.querySelector('#panel').style.display='flex';document.querySelector('#heading').textContent=title;document.querySelector('#message').textContent=message;document.querySelector('#status').textContent='';const choices=document.querySelector('#choices');choices.replaceChildren();options.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;choices.append(b)})}function close(){dialog=false;document.querySelector('#panel').style.display='none'}document.querySelector('#close').onclick=close;
function lesson(){const q=questions[quiz];open('Coach Ace · Math '+(quiz+1)+'/3',q[0],q[1].map((label,i)=>[label,()=>{if(i===q[2]){quiz++;if(quiz===questions.length){stage=3;xp+=100;save();ui();open('Lesson passed!','You earned 100 XP. Visit the store to apply your math skills.');}else lesson()}else document.querySelector('#status').textContent='Try again. Calculate 20% first!'}]))}
function scienceLesson(){const q=scienceQuestions[scienceIndex];open('Science Discovery · '+(scienceIndex+1)+'/3',q[0],q[1].map((answer,i)=>[answer,()=>{if(i===q[2]){scienceIndex++;if(scienceIndex===scienceQuestions.length){stage=5;xp+=125;save();ui();open('Science badge unlocked!','You completed Science Discovery and earned 125 XP. More lessons are coming!')}else scienceLesson()}else document.querySelector('#status').textContent='Not quite. Think like a scientist and try again!'}]))}
function interact(){if(dialog)return;const p=player.g.position;const dist=(x,z)=>Math.hypot(p.x-x,p.z-z);if(stage===0&&dist(4,-13)<6){stage=1;p.set(5,0,-43);save();ui();open('Welcome to WealthCare Academy!','Find Coach Ace in the courtyard classroom. Press E near the teacher.')}else if(stage===1&&dist(7,-48)<7){stage=2;save();ui();open('Coach Ace','Today we are learning percentages! A 20% discount means you save $20 for every $100.',[['Start lesson',()=>{quiz=0;lesson()}]])}else if(stage===2&&dist(7,-48)<7)lesson();else if(stage===3&&dist(34,10)<7){stage=4;xp+=75;cash-=73;save();ui();open('Campus Store · Success!','Backpack $60 − 20% ($12) = $48. Add $25 = $73. You earned 75 XP!')}else if(stage===4&&dist(-36,17)<7){scienceIndex=0;open('Dr. Nova · Science Lab','Welcome to Science Discovery! Investigate plants, fair experiments, and the energy that powers ecosystems.',[['Start science challenge',()=>scienceLesson()]])}else if(dist(8,-8)<5)open('Campus Guide','Head toward the big academy building and look for the green entrance.');else open('Explore Wealth City','Get closer to the academy, Coach Ace, or the campus store to interact.')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact();if(e.key===' '&&!jumping){vy=8;jumping=true}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelector('#act').onclick=interact;document.querySelector('#jump').onclick=()=>{if(!jumping){vy=8;jumping=true}};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[k]=false});let drag=false,lastX=0;renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX};addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-lastX)*.006;lastX=e.clientX}});
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),p=player.g.position;let dx=(keys.d?1:0)-(keys.a?1:0),dz=(keys.s?1:0)-(keys.w?1:0);const moving=dx||dz;if(moving&&!dialog){const len=Math.hypot(dx,dz);dx/=len;dz/=len;const vx=dx*Math.cos(yaw)+dz*Math.sin(yaw),vz=-dx*Math.sin(yaw)+dz*Math.cos(yaw);const speed=keys.shift?11:6;let nx=p.x+vx*speed*dt,nz=p.z+vz*speed*dt;const hit=buildings.some(b=>nx>b.x-b.w/2-.5&&nx<b.x+b.w/2+.5&&nz>b.z-b.d/2-.5&&nz<b.z+b.d/2+.5);if(!hit){p.x=nx;p.z=nz}player.g.rotation.y=Math.atan2(vx,vz)}vy-=20*dt;p.y=Math.max(0,p.y+vy*dt);if(p.y===0){vy=0;jumping=false}const t=performance.now()*.012;player.limbs.forEach((l,i)=>l.rotation.x=moving&&!dialog?Math.sin(t+(i%2)*Math.PI)*(keys.shift?.72:.48):0);player.g.rotation.z=moving&&!dialog?Math.sin(t*2)*.018:0;teacher.limbs[3].rotation.z=Math.sin(t*.22)*.35-.5;scientist.limbs[2].rotation.z=Math.sin(t*.3)*.25+.4;labMarker.rotation.y+=dt*.7;labMarker.position.y=9.7+Math.sin(t*.15)*.3;const behind=new THREE.Vector3(Math.sin(yaw)*8,5.4,Math.cos(yaw)*8);camera.position.lerp(p.clone().add(behind),.12);camera.lookAt(p.x,p.y+1.7,p.z);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
